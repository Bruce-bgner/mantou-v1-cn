name: Build Mantou Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install ARM GCC toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi

    - name: Install Python & crcmod
      run: |
        sudo apt-get install -y python3 python3-pip
        pip3 install crcmod

    - name: Build firmware
      run: make clean && make all

    - name: Pack firmware (add metadata)
      run: |
        python3 utils/fw-pack.py bin/*.bin \
          "$(grep -oP '(?<=AUTHOR_STRING\s*=\s*")[^"]*' Makefile)" \
          "$(grep -oP '(?<=VERSION_STRING\s*=\s*")[^"]*' Makefile)" \
          bin/Mantou.packed.bin || true

    - name: Show build artifacts
      run: ls -la bin/

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mantou-V1.0-firmware
        path: |
          bin/*.bin

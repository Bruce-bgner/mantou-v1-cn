name: Build Mantou Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install ARM GCC toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi

    - name: Install Python & crcmod
      run: |
        sudo apt-get install -y python3 python3-pip
        pip3 install crcmod

    - name: Build firmware
      run: make clean && make all

    - name: Pack firmware (add metadata for flasher)
      run: |
        BIN_DIR=firmware
        BIN_FILE=$(ls $BIN_DIR/*.bin 2>/dev/null | head -1)
        if [ -n "$BIN_FILE" ]; then
          echo "Found bin: $BIN_FILE"
          PACKED_OUT="${BIN_FILE%.bin}.packed.bin"
          python3 utils/fw-pack.py "$BIN_FILE" "Mantou-CN" "V1.0-CN" "$PACKED_OUT" || true
          ls -la $BIN_DIR/
        else
          echo "WARNING: no .bin file found in firmware/ or _build/"
          find . -maxdepth 3 -name "*.bin" -o -name "*.out" || true
        fi

    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mantou-V1.0-firmware
        path: |
          firmware/*.bin
          firmware/*.packed.bin
          _build/*.out
